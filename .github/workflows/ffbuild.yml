name: ffbuild

on:
  push:
    branches:
      - 'android-python'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v3

            - uses: actions/setup-python@v5
              with:
                python-version: 'v3.13'

            - name: build
              run: chmod +x ./build_py_all.sh && ./build_py_all.sh

            - name: upload
              uses: actions/upload-artifact@v3
              with:
                  name: packages
                  path: ./prefix*.tar