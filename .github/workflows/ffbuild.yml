name: ffbuild

on:
  push:
    branches:
      - 'dev-pmail'

jobs:
    build:
        runs-on: ubuntu-22.04
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                repository: forworldm/PMail
                ref: w-dev

            - uses: actions/setup-go@v7
              with:
                go-version-file: 'server/go.mod'
                cache: false

            - name: build
              run: make build

            - name: upload
              uses: actions/upload-artifact@v4
              with:
                  name: pmail
                  path: output