name: ffbuild

on:
  push:
    branches:
      - 'dev-binutils'

jobs:
    build:
        runs-on: ubuntu-22.04
        container:
          image: alpine:latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - run: apk add --no-cache bash

            - name: build
              run: ./build.sh

            - name: upload
              uses: actions/upload-artifact@v4
              with:
                  name: binutils
                  path: install