name: ffbuild

on:
  push:
    branches:
      - 'dev-clip'

jobs:
    build:
        runs-on: ubuntu-22.04
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                repository: forworldm/super-clipboard
                ref: w-dev

            - uses: actions/setup-go@v7
              with:
                go-version-file: 'go-backend/go.mod'
                cache: false

            - name: build backend
              run:  cd go-backend && make build

            - name: build
              run: npm install && npm run build && mv dist go-backend/bin

            - name: upload
              uses: actions/upload-artifact@v4
              with:
                  name: super-clipboard
                  path: go-backend/bin